# Applied to every response the site makes.
#
# The CSP is deliberately narrow. The two third-party scripts are the analytics
# providers disclosed on /privacy: Google Analytics, which the built HTML asks
# for, and Cloudflare Web Analytics, which Cloudflare injects at the edge after
# the build. Automatic Cloudflare analytics reports to this site's own
# /cdn-cgi/rum endpoint, so connect-src 'self' already covers the beacon upload.
# If a page ever needs an inline script, it gets a nonce — it does not get
# 'unsafe-inline'.
# `blob:` on img-src and media-src is for the support form only: when somebody
# picks a screenshot, the page shows it back to them before it is sent, from a
# URL.createObjectURL handle. That preview is the moment a person notices their
# account name in the corner of the picture, so it is worth the directive — and
# a blob is same-origin data the page itself created, not a remote source.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           $oda_referrer_policy always;
add_header X-Frame-Options           "DENY" always;
add_header Cross-Origin-Opener-Policy    "same-origin" always;
add_header Cross-Origin-Resource-Policy  "same-origin" always;

# Nothing here uses a camera, a microphone, a location or a payment handler.
# Saying so stops an injected script from asking on our behalf.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

# Ignored over plain HTTP and enforced the instant TLS is in front of it.
# Deliberately no `preload`: submitting to the preload list is effectively
# irreversible, and that is a decision to take once the certificate is proven,
# not as a side effect of a config change.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
