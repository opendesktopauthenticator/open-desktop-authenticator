ssl_certificate     /etc/letsencrypt/live/opendesktopauthenticator.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/opendesktopauthenticator.com/privkey.pem;

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout       1d;
ssl_session_cache         shared:SSL:10m;
ssl_session_tickets       off;

# **No OCSP stapling, and not by oversight.** Let's Encrypt has finished
# removing OCSP: certificates it issues now carry no responder URL at all, so
# `ssl_stapling on` is ignored and nginx warns about it on every reload. Config
# that claims a protection which cannot happen is worse than no config, because
# the next person reads it and believes revocation is being stapled. Revocation
# for these certificates relies on their short lifetime instead.
ssl_trusted_certificate /etc/letsencrypt/live/opendesktopauthenticator.com/chain.pem;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
