# Never advertise the version. It tells a scanner which CVEs to try and tells a
# visitor nothing.
server_tokens off;

# Bounded requests. Every one of these is a memory-exhaustion lever if left
# unbounded, and nothing this site serves needs generous limits.
client_max_body_size        64k;
client_body_buffer_size     16k;
client_header_buffer_size   4k;
large_client_header_buffers 4 8k;
client_body_timeout         12s;
client_header_timeout       12s;
send_timeout                20s;
keepalive_timeout           30s;
reset_timedout_connection   on;

# Rate limits, defined here and applied per location. Keyed on the real client
# address, which the Cloudflare block above is what makes meaningful.
limit_req_zone  $binary_remote_addr zone=site:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=tickets:10m rate=6r/m;
# Uploads are their own zone: four files on one report would exhaust a 6r/m
# budget on their own, and a person adding screenshots is not the traffic the
# ticket limit exists to stop.
limit_req_zone  $binary_remote_addr zone=uploads:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

# `gzip on` lives in nginx.conf; repeating it here is a duplicate-directive
# error that stops nginx loading at all. Only the tuning belongs in this file.
gzip_vary         on;
gzip_min_length   512;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml application/javascript application/json
                  application/xml image/svg+xml application/manifest+json;

# Logs keep the real client address, not Cloudflare's.
# Combined, plus our extras on the end.
#
# **The prefix is not cosmetic.** This started as a tidier custom format that
# dropped the `- -` and the bracketed timestamp, and every stock fail2ban filter
# silently matched nothing: the nginx jails were enabled, running, and inert.
# An intrusion-prevention rule that cannot read the log is worse than none,
# because it looks like cover. Anything appended after the combined fields is
# ignored by the filters, so extras go at the end.
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'host=$host rt=$request_time';
access_log /var/log/nginx/access.log main;
