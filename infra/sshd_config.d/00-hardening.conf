# Managed hardening. Named 00- deliberately: sshd takes the FIRST value it sees
# for a keyword, and the cloud image ships 50-cloud-init.conf turning password
# authentication back on. Sorting ahead of it is what makes this authoritative.

# Keys only. Every account that needs in already has one.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Root may still log in, but only with a key. Left reachable on purpose: it is
# how the founder already connects, and taking it away without warning is how
# people lose access to their own server. `no` is the stronger setting and is a
# one-line change once the deploy account is known to work for them too.
PermitRootLogin prohibit-password

# Only these two accounts, whatever else exists on the box.
AllowUsers root deploy

# A key either works or it does not; six tries is for guessing passwords.
MaxAuthTries 3
LoginGraceTime 20
MaxSessions 6
MaxStartups 10:30:60

# Modern primitives only. Everything with a known weakness is simply absent
# rather than deprioritised, so a downgrade has nothing to fall back to.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# Nothing here needs a display or an agent forwarded into it. Local forwarding
# stays, because `ssh -L` is how an admin reaches the ticket tool without
# exposing its port to the internet.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
PermitTunnel no
GatewayPorts no

# Drop sessions that have stopped answering rather than holding them open.
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
