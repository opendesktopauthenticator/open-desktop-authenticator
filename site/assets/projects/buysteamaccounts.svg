<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BuySteamAccounts">
  <style>
    /* The mark is drawn for a dark ground. On a light tab strip or a light
       browser theme the cyan would be too pale to read, so the same shapes are
       redrawn in deeper values rather than shipping a second file. */
    .top { fill: #2BB8E8; }
    .bot { fill: #6247E0; }
    @media (prefers-color-scheme: dark) {
      .top { fill: #3FE0FF; }
      .bot { fill: #7A5CFF; }
    }
  </style>

  <!-- A B built as two bowls that never meet. Where a B normally joins at the
       waist there is a real gap, and the stem is the wall they both sit
       against: two compartments, one standard, nothing crossing between them.
       The lower bowl is wider than the upper, as it is in any drawn B - the
       eye reads an even letter, not two equal halves. -->
  <rect class="top" x="10" y="9" width="9.5" height="46" rx="1.5"/>

  <path class="top" d="M19.5 9 h16 a11 11 0 0 1 0 22 h-16 v-7.5 h15 a3.5 3.5 0 0 0 0 -7 h-15 z"/>

  <path class="bot" d="M19.5 34 h18.5 a10.5 10.5 0 0 1 0 21 h-18.5 v-7.5 h17.5 a3.5 3.5 0 0 0 0 -6 h-17.5 z"/>
</svg>
