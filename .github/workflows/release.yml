name: Release

# Tags only, and only ones shaped like a version.
#
# **Never on a branch push.** §4's chain is website -> company -> repository ->
# public CI build -> published hash, and the value of the CI link is that the
# artifact corresponds to a specific reviewable commit that a stranger can check
# out. A release built from a moving branch corresponds to nothing.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (must already be pushed)'
        required: true

# Read-only by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Deliberately NOT cancel-in-progress. Half-publishing a release is worse than
  # running twice.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The same gate CI runs, re-run against the tag.
  #
  # Not redundant with ci.yml. CI proves a *commit* was green; this proves the
  # tag is, and a tag can point somewhere CI never saw — moved, cut from a
  # branch that was never pushed, or created before a fix landed. The release
  # checklist says "main is green" and this is what makes that true of the thing
  # actually being shipped.
  # ---------------------------------------------------------------------------
  verify:
    needs: version
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx electron-vite build
      - run: npm test
      - run: node site/build.mjs
      - run: node site/verify.mjs
      - run: node site/selftest.mjs

      # Production dependencies are what ships. A release is exactly the moment
      # a known-vulnerable transitive dependency must not go out quietly.
      - name: npm audit (production)
        run: npm audit --audit-level=high --omit=dev

      # **The other half of CI's gate, and it was left behind.**
      #
      # The job header above says "the same gate CI runs, re-run against the
      # tag". Whoever wrote it deliberately pulled the production audit across
      # from CI's separate `security` job — and took one of that job's three
      # steps. This is the other gating one. `osv-scanner` exists precisely to
      # cover advisories npm's own database misses, so without it an advisory
      # present in OSV and absent from npm blocked every pull request and could
      # not block a release.
      #
      # Pinned to a SHA like everything else in this file; `ci.yml` may use a
      # mutable tag because that job holds no secrets, and this one signs.
      #
      # **Linux only, and that is not an optimisation.** This action declares
      # `runs.using: docker`, and GitHub runs Docker actions on Linux runners
      # only — so on the Windows leg of this matrix it does not skip, it fails.
      # `ci.yml` never hit this because its `security` job is single-runner
      # Linux; this job is a matrix, which is exactly the difference a copied
      # step does not carry with it.
      #
      # The scan is of `package-lock.json`, which is identical on both legs, so
      # one run answers for both.
      - name: osv-scanner (shipping dependencies)
        if: runner.os == 'Linux'
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  # ---------------------------------------------------------------------------
  # The tag says one thing; package.json must say the same.
  #
  # Cheap, and it catches the mistake that is impossible to fix after the fact:
  # tagging v0.2.0 while the manifest still reads 0.1.0 produces installers named
  # for a version the application does not report, so the About screen, the
  # update check and the filename disagree for ever.
  # ---------------------------------------------------------------------------
  version:
    name: tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          node -e "
          const dispatched = process.env.EVENT_NAME === 'workflow_dispatch';
          const exactTag = process.env.REF_TYPE === 'tag' && process.env.REF_NAME === process.env.TAG_INPUT;
          if (dispatched && !exactTag) {
            console.error('A manual release must be dispatched from that exact tag.');
            process.exit(1);
          }
          "

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Compare
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # Through the environment, not interpolated into the script. GitHub
          # substitutes expressions before the shell parses, so a dispatch input
          # written straight into this script is a command-injection sink. It
          # takes repository write access, which is already a total compromise —
          # and it is one line.
          #
          # Do not write an empty expression here to illustrate the point. An
          # earlier version of this comment did, and GitHub evaluates expressions
          # inside `run:` bodies too: the empty one failed the whole workflow at
          # load, with no job and no log to say why.
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          manifest="v$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          # The dispatched ref must BE a pushed tag, not merely equal a version
          # string. `actions/checkout` accepts any ref, so a branch named like a
          # tag built the branch — and `gh release create` would then invent the
          # missing tag from the default branch, publishing hashes and
          # provenance for one commit against binaries from another. Fetching
          # the tag from origin is what proves it exists remotely; comparing it
          # to HEAD is what proves the build is of that exact commit.
          if ! git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            echo "::error::$tag is not a pushed tag on this repository"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$tag^{commit}")" ]; then
            echo "::error::the checked-out commit does not match tag $tag"
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match package.json ($manifest)"
            exit 1
          fi

      # The checklist's other gate — `hasUnresolvedBranding()` returning false —
      # is not repeated here. `tests/branding.test.ts` already asserts it, and
      # the verify job runs the suite against this same tag, so a placeholder
      # product name fails the release before this job is even reached. A second
      # copy of the check would be one more thing to keep in step with the first.

  # ---------------------------------------------------------------------------
  # Package, per platform, on the platform.
  #
  # Windows installers are built on Windows and Linux packages on Linux. Cross
  # building is possible and is not worth the class of bug it invites — an NSIS
  # installer produced under wine differs from one produced by the toolchain
  # users actually run.
  #
  # The Store package (appx) IS built here, and is not released. That is a
  # change from what this comment used to say — it was written while the Partner
  # Center identity was still a placeholder, when `electron-builder.config.mjs`
  # refused to produce an appx at all and adding one would have failed every
  # release. The identity exists now, so the package is built to prove it still
  # matches (a mismatch is otherwise discovered at upload, slowly), uploaded as a
  # workflow artifact for the maintainer, and never downloaded into the staging
  # directory the release publishes from. See `pattern: package-*` below, which
  # is what enforces the second half.
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.os }})
    needs: [verify, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # **Architectures are named here, not left to the config.** Passing
          # targets on the command line overrides `win.target` in
          # electron-builder.config.mjs entirely, including its `arch` array —
          # so the config declared `['x64', 'arm64']` while every release built
          # x64 only, and no arm64 installer has ever existed. The config was
          # not wrong and the workflow was not wrong; they simply disagreed, and
          # nothing compared them. `tests/release-assets.test.ts` now does.
          - os: windows-latest
            targets: --win nsis:x64 nsis:arm64 portable:x64
          - os: ubuntu-latest
            targets: --linux AppImage deb
          # macOS builds on every release, signed or not. Unsigned it is not
          # published — see the artifact name below — but it is built, so the
          # target is exercised continuously rather than first attempted on the
          # day the Apple certificate arrives. Same reasoning as the appx step.
          - os: macos-latest
            targets: --mac dmg:x64 dmg:arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # One deliberate switch controls both signing and publication. Secrets may
      # be populated before the account is ready; that must not quietly change
      # the release. Conversely, saying it is ready while one credential is
      # absent must fail before a long package build produces an unusable DMG.
      - name: Validate macOS signing readiness
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_READY: ${{ vars.MACOS_SIGNING_READY }}
          MACOS_CERTIFICATE_P12: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD:
            ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_TEAM_ID || '' }}
        run: |
          node -e "
          if (process.env.MACOS_SIGNING_READY !== 'true') process.exit(0);
          const required = ['MACOS_CERTIFICATE_P12', 'MACOS_CERTIFICATE_PASSWORD', 'APPLE_API_KEY_P8', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER', 'APPLE_TEAM_ID'];
          const missing = required.filter((name) => !(process.env[name] || '').trim());
          if (missing.length) {
            console.error('MACOS_SIGNING_READY is true but these credentials are empty: ' + missing.join(', '));
            process.exit(1);
          }
          "

      - run: npm ci

      # `--publish never`. This workflow uploads deliberately, in one place,
      # after hashing — rather than letting the packager push assets as it
      # finishes each one, which would produce a release whose contents depend
      # on how far the build got.
      # **`APPLE_API_KEY` is a path, not a key.**
      #
      # electron-builder hands it straight to `@electron/notarize`, which puts it
      # after `xcrun notarytool --key` — and that wants a file. The published
      # electron-builder documentation says to set this variable to the
      # base64-encoded contents of the `.p8`, which would make notarisation fail
      # looking for a file named after a wall of base64. Settled by reading
      # `@electron/notarize`'s own types in `node_modules`, whose wording is
      # unambiguous: "File system path to the `.p8` private key".
      #
      # So the secret holds base64 (a `.p8` is multi-line PEM and survives a
      # secret box badly) and this step turns it back into a file. `RUNNER_TEMP`
      # dies with the runner, and the step below removes it anyway.
      - name: Materialise the notarisation key
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true'
        shell: bash
        env:
          KEY_BASE64: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo "::error::MACOS_SIGNING_READY is true but APPLE_API_KEY_P8 is empty."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          # Never the contents. A malformed secret shows up as a length of zero.
          echo "wrote $(wc -c < "$RUNNER_TEMP/apple-api-key.p8") bytes"

      # **The signing variables are gated on the runner, not left to resolve
      # empty.** `CSC_LINK` is not a macOS variable — electron-builder reads it
      # on Windows too, and a Developer ID certificate handed to a Windows build
      # makes it try to sign the `.exe` with it and fail. So each one is either
      # the secret or nothing, decided by which runner this is.
      #
      # Both credentials or neither: the config refuses a half-configured
      # environment rather than producing a signed-but-un-notarised `.dmg`,
      # which Gatekeeper blocks everywhere except the machine that built it.
      - name: Package
        env:
          CSC_LINK: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.MACOS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          # The path written above, not the key itself. See that step.
          APPLE_API_KEY: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY == 'true') &&
            secrets.APPLE_TEAM_ID || '' }}
        run: npm run build && npx electron-builder --config electron-builder.config.mjs ${{ matrix.targets }} --publish never

      - name: Verify the packaged portable runtime contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -LiteralPath release -File -Filter '*-portable.exe')
          if ($portable.Count -ne 1) {
            throw "Expected exactly one packaged portable executable, found $($portable.Count)."
          }
          ./.github/scripts/verify-portable-runtime.ps1 -PortablePath $portable[0].FullName

      - name: Verify the first-party licence in every packaged application archive
        run: node .github/scripts/verify-packaged-license.mjs --tree release

      # The private key does not outlive the step that needed it. `RUNNER_TEMP`
      # is discarded with the runner, so this is belt and braces — but a signing
      # key sitting in a workspace for the rest of a job is the kind of thing
      # that becomes a habit and then becomes a cached artifact.
      - name: Remove the notarisation key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      # The Store package, built separately and **not published as a release
      # asset**.
      #
      # It is not a file anyone downloads: an appx built for the Store is
      # deliberately unsigned, because Microsoft re-signs it on ingestion, so a
      # visitor who downloaded it could not install it. It goes to Partner
      # Center by hand. Building it here anyway is what proves the Store
      # identity still matches — a mismatch is rejected at upload, which is a
      # slow and confusing place to learn about it.
      #
      # `continue-on-error`, because the direct-download channel must not stop
      # shipping over a Store tool. The step's own conclusion still shows.
      - name: Package for the Store
        id: store_package
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npx electron-builder --config electron-builder.config.mjs --win appx --publish never

      # A toast can be displayed without either activation declaration, so a
      # successful AppX build alone does not prove that clicking its Action
      # Center history can launch the application. Inspect the manifest that is
      # actually inside the package, including the executable and fixed CLSID.
      - name: Verify Store notification activation
        id: store_manifest
        if: runner.os == 'Windows' && steps.store_package.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/verify-appx-toast-manifest.ps1

      - name: Verify the first-party licence in the Store package
        id: store_license
        if: runner.os == 'Windows' && steps.store_manifest.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/verify-appx-license.ps1

      - name: Collect the Store package
        if: runner.os == 'Windows' && steps.store_license.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p dist-store
          find release -maxdepth 1 -type f -name '*.appx' -exec cp {} dist-store/ \;
          ls -l dist-store || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows' && steps.store_license.outcome == 'success'
        continue-on-error: true
        with:
          name: store-package
          path: dist-store/
          if-no-files-found: warn
          retention-days: 7

      # Installers and archives only. `release/` also holds the unpacked tree,
      # the block maps and builder metadata, none of which anybody should
      # download and all of which would otherwise be hashed and published.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          find release -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} dist-release/ \;
          ls -l dist-release
          if [ -z "$(ls -A dist-release)" ]; then
            echo "::error::packaging produced no installable artifact"
            exit 1
          fi

      # **An unsigned macOS build is uploaded under a name the publish job
      # cannot collect.**
      #
      # `pattern: package-*` is what decides which artifacts reach the release
      # page. README states that this project will not ship an unsigned macOS
      # build, and that has to be enforced somewhere rather than remembered: an
      # unsigned `.dmg` is refused by Gatekeeper on every machine except the one
      # that built it, so publishing it would put an unusable file in the one
      # place this project asks strangers to trust. That is precisely how v1.0.0
      # shipped an appx nobody could install.
      #
      # Flip the `MACOS_SIGNING_READY` repository variable to `true` once the
      # Developer ID certificate and the notarisation key are in place. One
      # deliberate switch, visible in the repository settings — rather than the
      # release quietly changing shape the moment a secret is added.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name:
            ${{ (runner.os == 'macOS' && vars.MACOS_SIGNING_READY != 'true') && 'macos-unsigned-check'
            || format('package-{0}', matrix.os) }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # One hash file over everything, generated where everything is together.
  #
  # Per-platform SHA256SUMS files would give a verifier several files to check
  # and no single statement of what the release contains. §4 asks a stranger to
  # compare one published hash against the file they downloaded, so there is one
  # list covering every published asset.
  # ---------------------------------------------------------------------------
  publish:
    name: publish draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # **`pattern:` is load-bearing.** Without it this downloads every artifact
      # the run produced, which includes `store-package` — and v1.0.0 shipped
      # exactly that way: an appx on the release page, listed in SHA256SUMS.txt,
      # and covered by no attestation, because the provenance step below names
      # three extensions and appx is not one of them.
      #
      # The Store package is deliberately unsigned; Microsoft re-signs it on
      # ingestion. A visitor who downloaded it could not install it. So it was
      # an unusable file, published by accident, in the one place this project
      # asks strangers to trust — which is worse than a missing feature.
      - name: Download the platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: staging
          pattern: package-*
          merge-multiple: true

      - name: List what will be published
        shell: bash
        run: ls -l staging

      # Everything published must be something the attestation below covers, or
      # metadata generated here. A comment saying the appx is not released did
      # not stop it being released; this does.
      #
      # Deliberately an allow-list. A deny-list would have needed somebody to
      # predict `.appx` in advance, which is precisely what did not happen.
      - name: Refuse to publish anything unattested
        shell: bash
        run: |
          cd staging
          unexpected=$(ls -1 | grep -v -E '\.(exe|AppImage|deb|dmg)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::staging holds files the provenance step does not attest:"
            echo "$unexpected"
            echo "Either attest them, or stop downloading them into staging."
            exit 1
          fi
          echo "Every staged artifact is one the attestation covers."

      # ---------------------------------------------------------------------
      # An SBOM of the application, not of the checkout.
      #
      # This scanned `path: .`, and what that published was worse than
      # publishing nothing at all.
      #
      # Scanning the checkout catalogues `spike/` — the Phase 0 proof of
      # concept whose own `package.json` describes itself as "Not shipped" — so
      # the public document advertised `request` and `steamcommunity`, which
      # between them reach eleven advisories with no fix available. §2.3 of
      # docs/THREAT_MODEL.md exists to say those are deliberately not in the
      # product and to show the measurements that got them out; the SBOM sat on
      # the release page saying the opposite.
      #
      # And it left Electron out. The scanner skips `devDependencies` by
      # default, and `electron` is one — because at development time it is a
      # build tool, while the thing a user downloads embeds the entire runtime.
      # So the document named vulnerable packages the product does not ship and
      # was silent about the largest thing it does.
      #
      # The scan therefore runs over a tree assembled to hold what the
      # installer contains, and the step after it checks the result says so.
      # `path: .` is one word and it reintroduces both halves at once.
      #
      # **And then the assembly broke, and no test could see it.** The step that
      # fixed the two faults above ended by deleting the lockfile from the
      # assembled tree, to stop the scanner honouring npm's `dev` flags and
      # dropping the electron entry it had just added. The flags are real and
      # the scanner does honour them. What the reasoning missed is that on a
      # *directory* scan the lockfile is the only npm inventory there is: Syft's
      # `javascript-package-cataloger`, the one that reads `node_modules`, is
      # tagged `installed` and `image` and carries no `directory` tag, so it
      # never ran. Deleting the lockfile deleted everything. An audit against
      # the scanner version this pinned action ships got three document entries
      # and no package URLs at all, and the guard below then reported forty
      # missing packages and two foreign entries and failed. Every release, from
      # the moment that line was written.
      #
      # Nothing caught it because nothing but a real release ever walked this
      # path. That is the more important half of the repair:
      # `.github/workflows/sbom.yml` now runs this same assembly, the same
      # scanner and the same guard on every push and pull request, against the
      # same scripts, so the next time this breaks it breaks in front of
      # somebody rather than on release day.
      # ---------------------------------------------------------------------
      - name: Node, to assemble the shipping tree
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Installs production dependencies into `sbom-root`, writes the manifest
      # and lockfile the scanner reads, adds electron, and writes the scanner's
      # configuration. All of that lives in the script rather than here, and
      # deliberately: `sbom.yml` runs the identical line on every pull request,
      # and two copies of this in two files would drift until a release found
      # the difference.
      - name: Assemble the tree the SBOM describes
        shell: bash
        run: node .github/scripts/assemble-shipping-tree.mjs

      - name: Show what the scanner was told
        shell: bash
        run: cat sbom-syft.yaml

      # `config:` restricts this to the JavaScript catalogers. Without it the
      # scanner brings its whole directory set to a tree that holds nothing but
      # package metadata, and anything they find arrives without an npm package
      # URL — which is both noise in a published document and the shape
      # contamination takes when it wants to slip past a comparison made on
      # package URLs. The guard below rejects such entries outright, so this is
      # what keeps that rejection from being a permanent red.
      #
      # The scanner version is fixed by the action's pinned SHA, not named
      # separately here: pinning it twice would let a Dependabot bump of the
      # action move one and not the other, and `sbom.yml` runs this same SHA on
      # every pull request, so a bump that changes cataloguing behaviour is
      # caught on the pull request that makes it.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: sbom-root
          config: sbom-syft.yaml
          format: spdx-json
          output-file: staging/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The step above is a run of shell commands whose failure mode is
      # silence: a scan that finds nothing still writes a valid SPDX document,
      # and the release would publish it with a straight face. So the file that
      # ships is checked here, before the checksum list is written over it.
      #
      # The check that used to live here named `request`, `steamcommunity` and
      # `spike-cli` as forbidden strings and otherwise asked only for ten
      # packages and an electron entry. An adversarial review defeated it three
      # ways in an afternoon: delete `--omit=dev` from the assembly above and
      # the SBOM becomes 495 packages of eslint and vitest and the check prints
      # success; call the spike package `phase0-spike` and the deny-list of
      # three never sees a fourth name; hand it an SBOM of a completely
      # different application with one correct electron entry and it passes
      # that too.
      #
      # So the script states what SHIPS. It walks package.json and
      # package-lock.json — neither of which the assembly step touches — to
      # derive the production dependency closure npm would install, and the
      # SBOM has to be that set exactly: nothing outside it, nothing missing
      # from it. All three escapes are outside it, and so is the next one
      # nobody has thought of yet.
      #
      # `BUILDER_CONFIG` is new and it is not optional. The script used to
      # report the closure as "packages the installer contains", and for three
      # of them that was false: `electron-builder.config.mjs` excludes
      # `react`, `react-dom` and `scheduler` from the asar because Vite has
      # already compiled them into the renderer. Their code ships, so they
      # belong in the SBOM and the check still demands them — but it now reads
      # the exclusions out of the packaging configuration and says which of the
      # two shapes each package ships in, rather than asserting something a
      # reader could check and find untrue.
      #
      # **`continue-on-error: true` must never appear on this step.** It would
      # turn the one gate standing between a wrong SBOM and the release page
      # into a suggestion, and that idiom is used three times elsewhere in this
      # file for genuinely optional things, so it is a plausible edit. Rather
      # than trusting a comment to prevent it, the script writes a receipt
      # naming the digest of the document it approved, and `Generate
      # SHA256SUMS.txt` refuses to run without one that matches. That step
      # cannot be made advisory in turn: cosign signs its output and the step
      # after that verifies the signature, so a release which skips it has no
      # signed checksum list and dies anyway.
      - name: The SBOM must list the shipping tree, exactly
        shell: bash
        env:
          SBOM: staging/sbom.spdx.json
          MANIFEST: package.json
          LOCKFILE: package-lock.json
          BUILDER_CONFIG: electron-builder.config.mjs
        run: |
          RECEIPT="$RUNNER_TEMP/sbom-verified.sha256" \
            node .github/scripts/assert-sbom-is-the-shipping-tree.mjs

      - name: Generate SHA256SUMS.txt
        shell: bash
        working-directory: staging
        run: |
          # The receipt the step above leaves behind, checked before anything is
          # hashed. Absent, it means the guard did not run or did not pass —
          # skipped, or made advisory — and this release has no statement about
          # what its SBOM contains. Present but not matching, it means something
          # rewrote the document after it was inspected, so what would ship is
          # not what was checked.
          receipt="$RUNNER_TEMP/sbom-verified.sha256"
          if [ ! -f "$receipt" ]; then
            echo "::error::the SBOM guard left no receipt, so it did not run or did not pass. Nothing here can vouch for sbom.spdx.json, and this release will not publish an SBOM nobody checked."
            exit 1
          fi
          sha256sum --check --strict "$receipt"

          # Removed first. On a re-run the file is already there, the glob picks
          # it up, and the list gains an entry for its own earlier contents —
          # which can never verify, on a file whose whole job is verifying.
          rm -f SHA256SUMS.txt
          # Sorted, and with bare filenames rather than paths, so the file reads
          # the same way `sha256sum -c SHA256SUMS.txt` expects to consume it.
          sha256sum -- * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ---------------------------------------------------------------------
      # Sign the checksum list.
      #
      # The hashes prove a file was not altered on its way to you. They cannot
      # prove the *list* is ours: whoever can replace a binary on a release page
      # can usually replace the hash file sitting beside it, and /verify says so
      # in as many words. This closes that.
      #
      # Keyless, deliberately. `cosign` mints a short-lived certificate bound to
      # this workflow's OIDC identity — the same trust root as the provenance
      # attestation below — so there is no private key for a single maintainer
      # to hold, escrow, lose, or have stolen. MAINTENANCE.md names "the
      # maintainer disappears" as this project's largest risk; a signing key
      # that only one person can reproduce would have made that worse.
      #
      # Runs after the list is generated and before the release is created, so
      # what ships is the signature of the file that ships.
      # ---------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksum list
        shell: bash
        working-directory: staging
        env:
          # Non-interactive: the runner cannot answer a confirmation prompt, and
          # a hung release job is worse than a failed one.
          COSIGN_YES: 'true'
        run: |
          cosign sign-blob SHA256SUMS.txt \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem
          echo "--- signature ---"
          cat SHA256SUMS.txt.sig
          echo

      # Proving it here rather than trusting it. A signature nobody verified is
      # a file with a confident extension, and the first person to check should
      # not be a user deciding whether their download was tampered with.
      - name: Verify the signature we just made
        shell: bash
        working-directory: staging
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # **An exact identity, bound to the tag being built.**
          #
          # This was a regexp ending at `@refs/tags/`, on the reasoning that a
          # dispatch run could not know the tag. That reasoning was inverted:
          # Fulcio derives the certificate SAN from the run's **workflow ref**,
          # not from what the job checked out. On a tag push that is
          # `refs/tags/<tag>`; on a dispatch with a tag as the ref it is also
          # `refs/tags/<tag>`; on a dispatch from a branch it is
          # `refs/heads/<branch>`, which the old prefix already rejected. So the
          # exactness the comment said was impossible costs nothing on every path
          # that is supposed to work.
          #
          # What the prefix did allow, and this forbids: a dispatch carrying
          # `ref: v0.0.1` with `inputs.tag: v9.9.9`. Every checkout uses the
          # input, the version job compares HEAD against v9.9.9 and passes, and
          # `gh release create` publishes under v9.9.9 — while the certificate
          # says `@refs/tags/v0.0.1`. A prefix accepts that. Signature and
          # release would then name different tags with nothing comparing them.
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          echo "expecting identity: $identity"
          cosign verify-blob SHA256SUMS.txt \
            --signature SHA256SUMS.txt.sig \
            --certificate SHA256SUMS.txt.pem \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      # Proof of *where* the bytes came from: which workflow, which commit,
      # which runner. This is the closest thing to a signature the direct
      # download channel has, there being no code-signing certificate, and unlike a
      # certificate it says something a certificate cannot — that these bytes
      # were produced by this public workflow from this tag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            staging/*.exe
            staging/*.AppImage
            staging/*.deb
            staging/*.dmg

      # The direct Windows/Linux channel is deliberately unsigned. A macOS DMG
      # is published only when the readiness gate made it signed and notarised,
      # so one blanket sentence about "the files" becomes false at that point.
      # Generate the copy from the same switch that names the macOS artifact.
      - name: Generate draft release notes
        env:
          MACOS_SIGNING_READY: ${{ vars.MACOS_SIGNING_READY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          node -e "
          const mac = process.env.MACOS_SIGNING_READY === 'true'
            ? '**The published macOS DMGs are Developer ID-signed and notarized by Apple.** Gatekeeper can verify their Developer ID and notarization ticket.'
            : '**No macOS DMG is included in this release.** The continuously tested unsigned macOS build stays inside CI until signing and notarization are ready.';
          const identity = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/.github/workflows/release.yml@refs/tags/' + process.env.TAG;
          const fence = String.fromCharCode(96).repeat(3);
          const slash = String.fromCharCode(92);
          const code = (language, command) => '\n\n' + fence + language + '\n' + command + '\n' + fence;
          process.stdout.write([
            'Draft. Release notes are written by hand before publishing — see docs/RELEASE_CHECKLIST.md.',
            '**On Windows, most people want the Microsoft Store instead.** Microsoft re-signs that package, so it never trips SmartScreen and there is nothing to check by hand.',
            '**Windows and Linux direct downloads are unsigned.** They carry no code-signing certificate and none is planned, so Windows warns on first run. Check them against SHA256SUMS.txt and the provenance attestation on this release.',
            mac,
            'Verify on Linux:' + code('shell', 'sha256sum --check --ignore-missing SHA256SUMS.txt'),
            'Verify on macOS:' + code('shell', 'shasum -a 256 --check --ignore-missing SHA256SUMS.txt'),
            'Verify on Windows PowerShell:' + code('powershell', 'Get-FileHash .' + slash + '<file> -Algorithm SHA256'),
            'The checksum list itself is signed. Verify it with cosign:' + code('shell', 'cosign verify-blob SHA256SUMS.txt --signature SHA256SUMS.txt.sig --certificate SHA256SUMS.txt.pem --certificate-identity ' + identity + ' --certificate-oidc-issuer https://token.actions.githubusercontent.com')
          ].join('\n\n') + '\n');
          " > "$RUNNER_TEMP/release-notes.md"

      # A draft, always. The checklist requires a human to read the notes and
      # the asset list before anything is public, and "published automatically
      # by CI" is the one thing a release of this application must not be.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            staging/*
          echo "Draft created. Nothing is public until a human publishes it."
